name: omer_ai
description: ÖMER AI telefon uygulaması - tek başına çalışır, istenirse bilgisayardaki ÖMER AI'ya bağlanır.
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.2.2
  speech_to_text: ^7.0.0
  flutter_tts: ^4.0.2
  url_launcher: ^6.2.5
  image_picker: ^1.0.7

flutter:
  uses-material-design: true
  assets:
    - assets/dunya/
